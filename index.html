<!DOCTYPE html>
<html lang="pt">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <meta name="description"
      content="ASBKI Covilhã — Karate Shotokan desde 1998. Dois dojos, turmas dos 5 aos 70 anos. Primeira aula gratuita.">
   <title>ASBKI Covilhã — Karate Shotokan</title>
   <link rel="preconnect" href="https://fonts.googleapis.com">
   <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
   <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet">
   <link rel="stylesheet" href="/assets/css/style.css">
   <link rel="stylesheet" href="/assets/css/pages.css">
</head>

<body data-page="home">

   <div id="site-header"></div>

   <main>

      <!-- ═══ HERO ═══════════════════════════════════════════════════════════ -->
      <section class="hero" id="inicio">
         <div class="hero-bg">
            <div class="hero-bg-img" id="hero-bg-img"></div>
            <div class="hero-bg-overlay"></div>
         </div>
         <div class="hero-grid" aria-hidden="true"></div>
         <div class="hero-image" id="hero-image"></div>
         <div class="container">
            <div class="hero-inner">
               <span class="hero-badge" id="hero-badge"></span>
               <h1 class="hero-headline">
                  <span id="hero-line1"></span><br>
                  <span id="hero-line2"></span>
               </h1>
               <p class="hero-sub" id="hero-sub"></p>
               <div class="hero-actions" id="hero-actions"></div>
            </div>
         </div>
      </section>

      <!-- ═══ TREINAR (horários + eventos) ═════════════════════════════════ -->
      <section class="treinar" id="treinar">
         <div class="section-watermark" aria-hidden="true" data-text="02"></div>
         <div class="container">
            <div class="treinar-head fade-in">
               <h2 class="treinar-title" id="schedule-title">Treinos esta semana</h2>
               <a href="/inscricao#horarios" class="link-arrow" id="schedule-view-all">Horário completo →</a>
            </div>
            <div class="session-filters fade-in fade-in-delay-1" id="session-filters"></div>
            <div class="session-grid fade-in fade-in-delay-1" id="session-grid"></div>

            <div class="treinar-bottom fade-in fade-in-delay-2">
               <div class="events-panel">
                  <h3 class="panel-title" id="events-home-title">Próximas provas</h3>
                  <div class="events-list" id="events-list"></div>
                  <a href="/noticias" class="link-arrow" style="display:inline-block;margin-top:18px">Ver notícias do clube →</a>
               </div>
               <div class="socio-panel">
                  <h3 class="panel-title">Já és sócio?</h3>
                  <p class="panel-text">Consulta quotas, presenças e o teu percurso de graduações na área reservada.</p>
                  <a href="/contacto" class="btn btn-outline-ghost">Entrar na área de sócio</a>
               </div>
            </div>
         </div>
      </section>

      <!-- ═══ BENEFITS ═════════════════════════════════════════════════════ -->
      <section class="benefits surface-paper" id="beneficios">
         <div class="container">
            <div class="benefits-grid" id="benefits-grid"></div>
         </div>
      </section>

      <!-- ═══ CLASSES ══════════════════════════════════════════════════════ -->
      <section class="classes" id="modalidades">
         <div class="section-watermark" aria-hidden="true" data-text="03"></div>
         <div class="container">
            <div class="classes-header fade-in">
               <span class="section-label" id="classes-subtitle"></span>
               <h2 class="section-title" id="classes-title"></h2>
            </div>
            <div class="classes-grid fade-in fade-in-delay-1" id="classes-grid"></div>
            <div class="classes-footer fade-in fade-in-delay-2">
               <a href="/karate" class="btn btn-accent" id="classes-cta"></a>
            </div>
         </div>
      </section>

      <!-- ═══ ABOUT ════════════════════════════════════════════════════════ -->
      <section class="about surface-paper" id="sobre">
         <div class="section-watermark" aria-hidden="true" data-text="04"></div>
         <div class="container">
            <div class="about-3col">
               <div class="about-text fade-in">
                  <span class="section-label" id="about-subtitle"></span>
                  <h2 class="section-title dark" id="about-title"></h2>
                  <p class="about-para" id="about-text"></p>
                  <ul class="about-features" id="about-features"></ul>
                  <a href="/associacao" class="btn btn-accent" id="about-cta"></a>
               </div>
               <div class="about-center fade-in fade-in-delay-1">
                  <div class="about-splash"></div>
                  <div class="about-center-img" id="about-img">
                     <div class="about-img-placeholder" id="about-img-placeholder">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
                           <circle cx="12" cy="8" r="4" />
                           <path d="M6 20v-2a6 6 0 0 1 12 0v2" />
                        </svg>
                        <span>Imagem do Dojo</span>
                     </div>
                  </div>
               </div>
               <div class="about-stats-col fade-in fade-in-delay-2">
                  <span class="section-label" id="stats-subtitle"></span>
                  <h3 class="section-title dark about-stats-title" id="stats-title"></h3>
                  <div class="stats-grid-2col" id="stats-grid"></div>
               </div>
            </div>
         </div>
      </section>

      <!-- ═══ NOTÍCIAS RECENTES ════════════════════════════════════════════ -->
      <section class="home-news" id="noticias">
         <div class="section-watermark" aria-hidden="true" data-text="05"></div>
         <div class="container">
            <div class="section-head fade-in">
               <div>
                  <span class="section-label" id="news-subtitle"></span>
                  <h2 class="section-title" id="news-home-title"></h2>
               </div>
               <a href="/noticias" class="link-arrow" id="news-view-all"></a>
            </div>
            <div class="card-grid fade-in fade-in-delay-1" id="news-grid"></div>
         </div>
      </section>

      <!-- ═══ CTA ══════════════════════════════════════════════════════════ -->
      <section class="trial" id="experimentar">
         <div class="inscription-kanji" aria-hidden="true">入門</div>
         <div class="container">
            <div class="trial-inner fade-in">
               <span class="section-label">Primeira aula gratuita</span>
               <h2 class="section-title" id="trial-title"></h2>
               <p class="trial-sub" id="trial-sub"></p>
               <a href="/inscricao" class="btn btn-accent" id="trial-cta"></a>
            </div>
         </div>
      </section>

   </main>

   <div id="site-footer"></div>

   <script src="/assets/js/site.js"></script>
   <script src="/assets/js/home.js"></script>
</body>

</html>
