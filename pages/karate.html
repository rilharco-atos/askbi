<!DOCTYPE html>
<html lang="pt">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <meta name="description" content="Karate Shotokan na ASBKI Covilhã: Kihon, Kata e Kumite, turmas por idade e karate infantil.">
   <title>Karate — ASBKI Covilhã</title>
   <link rel="preload" href="/assets/fonts/archivo-latin.woff2" as="font" type="font/woff2" crossorigin>
   <link rel="preload" href="/assets/fonts/source-sans-3-latin.woff2" as="font" type="font/woff2" crossorigin>
   <link rel="stylesheet" href="/assets/css/style.css">
   <link rel="stylesheet" href="/assets/css/pages.css">
</head>
<body data-page="karate">
   <a class="skip-link" href="#conteudo">Saltar para o conteúdo</a>
   <div id="site-header"></div>
   <main id="conteudo" tabindex="-1">
      <section class="page-hero">
         <div class="container">
            <span class="section-label" id="ph-sub"></span>
            <h1 class="page-title" id="ph-title"></h1>
            <p class="page-intro" id="ph-intro"></p>
         </div>
      </section>
      <section class="page-section surface-paper">
         <div class="container">
            <div class="discipline-grid" id="discipline-grid"></div>
         </div>
      </section>
      <section class="page-section surface-paper alt" id="turmas">
         <div class="container">
            <div class="section-head fade-in">
               <div>
                  <span class="section-label" id="turmas-sub"></span>
                  <h2 class="section-title" id="turmas-title"></h2>
                  <p id="turmas-intro"></p>
               </div>
               <a href="/inscricao#horarios" class="link-arrow">Ver horários →</a>
            </div>
            <div class="classes-grid fade-in" id="classes-grid"></div>
         </div>
      </section>
      <section class="page-section surface-paper" id="infantil">
         <div class="container">
            <div class="kids-grid">
               <div class="kids-visual fade-in" id="kids-visual"><span class="kanji" aria-hidden="true">子</span></div>
               <div class="fade-in fade-in-delay-1">
                  <span class="section-label" id="kids-sub"></span>
                  <h2 class="section-title" id="kids-title" style="margin-bottom:20px"></h2>
                  <p class="page-intro" id="kids-intro" style="margin-top:0;font-size:17px"></p>
                  <div class="kids-bullets" id="kids-bullets"></div>
                  <p class="kids-closing" id="kids-closing"></p>
                  <a href="/inscricao" class="btn btn-accent" id="kids-cta"></a>
               </div>
            </div>
         </div>
      </section>
      <section class="page-cta" aria-label="Marcar aula experimental">
         <div class="container" id="karate-cta"></div>
      </section>
   </main>
   <div id="site-footer"></div>
   <script src="/assets/js/site.js"></script>
   <script src="/assets/js/pages.js"></script>
</body>
</html>
