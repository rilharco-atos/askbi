<!DOCTYPE html>
<html lang="pt">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <meta name="description" content="Sobre a ASBKI Covilhã: quem somos, a nossa abordagem ao karate Shotokan e a associação em números.">
   <title>Sobre nós — ASBKI Covilhã</title>
   <link rel="preconnect" href="https://fonts.googleapis.com">
   <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
   <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
   <link rel="stylesheet" href="/assets/css/style.css">
   <link rel="stylesheet" href="/assets/css/pages.css">
</head>
<body data-page="associacao">
   <div id="site-header"></div>
   <main>
      <section class="page-hero">
         <div class="container">
            <span class="section-label" id="ph-sub"></span>
            <h1 class="page-title" id="ph-title"></h1>
            <p class="page-intro" id="ph-intro"></p>
         </div>
      </section>

      <section class="about">
         <div class="section-watermark" aria-hidden="true">01</div>
         <div class="container">
            <div class="about-3col">
               <div class="about-text fade-in">
                  <span class="section-label">O que nos distingue</span>
                  <ul class="about-features" id="about-features"></ul>
                  <a href="/inscricao" class="btn btn-accent">Marcar aula experimental</a>
               </div>
               <div class="about-center fade-in fade-in-delay-1">
                  <div class="about-splash"></div>
                  <div class="about-center-img" id="about-img">
                     <div class="about-img-placeholder" id="about-img-placeholder">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><circle cx="12" cy="8" r="4"/><path d="M6 20v-2a6 6 0 0 1 12 0v2"/></svg>
                        <span>Imagem do Dojo</span>
                     </div>
                  </div>
               </div>
               <div class="about-stats-col fade-in fade-in-delay-2">
                  <span class="section-label" id="stats-subtitle"></span>
                  <h3 class="section-title dark about-stats-title" id="stats-title"></h3>
                  <div class="stats-grid-2col" id="stats-grid"></div>
               </div>
            </div>
         </div>
      </section>

      <section class="page-section">
         <div class="container">
            <div class="two-col">
               <div class="fade-in">
                  <span class="section-label" id="approach-sub"></span>
                  <h2 class="section-title" id="approach-title" style="margin-bottom:28px"></h2>
                  <div class="prose" id="approach-text"></div>
               </div>
               <div class="sticky-aside fade-in fade-in-delay-1">
                  <span class="section-label">A associação</span>
                  <div class="card-grid" style="grid-template-columns:1fr;gap:12px" id="assoc-links"></div>
               </div>
            </div>
            <div id="assoc-cta"></div>
         </div>
      </section>
   </main>
   <div id="site-footer"></div>
   <script src="/assets/js/site.js"></script>
   <script src="/assets/js/pages.js"></script>
</body>
</html>
