name: CI

on:
  push:
    branches: [dojo-home, master]
  pull_request:
    branches: [dojo-home, master]

env:
  PORT: 3104
  ASBKI_BASE_URL: http://127.0.0.1:3104
  CHROME_DEBUG_PORT: 9504
  ADMIN_PASSWORD: ci-test-password

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: browser-actions/setup-chrome@v1
        id: setup-chrome

      - name: Instalar dependências
        run: npm ci

      - name: Gate de placeholders em content.json
        run: npm run check:content
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}

      - name: Testes de fumo (servidor)
        run: npm test

      - name: Arrancar o servidor
        run: |
          nohup node server.js > server.log 2>&1 &
          echo $! > server.pid
          for i in $(seq 1 30); do
            curl -sf "$ASBKI_BASE_URL/" > /dev/null && break
            sleep 1
          done
          curl -sf "$ASBKI_BASE_URL/" > /dev/null || (echo "servidor não respondeu" && cat server.log && exit 1)

      - name: Testes de cliente (e2e)
        run: npm run e2e
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}

      - name: Auditoria de legibilidade e performance
        run: npm run audit
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}

      - name: Lighthouse CI
        # TODO (2026-09-07): tirar o continue-on-error quando a home cumprir o
        # orçamento (LCP <= 2500ms sob 4G lento — ver docs/qa/baseline.md) e o
        # bug de contraste do .card-title (assets/css/shoji.css) for corrigido.
        continue-on-error: true
        run: npx @lhci/cli autorun
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          LHCI_BUILD_CONTEXT__CURRENT_HASH: ${{ github.sha }}

      - name: Parar o servidor
        if: always()
        run: |
          if [ -f server.pid ]; then kill "$(cat server.pid)" || true; fi

      - name: Guardar capturas e relatórios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-artifacts
          path: |
            tests/artifacts/
            server.log
            .lighthouseci/
          if-no-files-found: ignore
          retention-days: 14
